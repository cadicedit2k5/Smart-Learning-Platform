services:

  # =====================================================
  # JWT KEY GENERATOR
  # =====================================================

  jwt-keygen:
    image: alpine:3.20

    command: >
      sh -c "
        apk add --no-cache openssl > /dev/null &&
        if [ ! -f /keys/private-key.pem ]; then
          echo 'Generating JWT keys...' &&
          openssl genpkey
            -algorithm RSA
            -out /keys/private-key.pem
            -pkeyopt rsa_keygen_bits:2048 &&
          openssl pkey
            -in /keys/private-key.pem
            -pubout
            -out /keys/public-key.pem &&
          chmod 644 /keys/private-key.pem /keys/public-key.pem;
        else
          echo 'JWT keys already exist.';
        fi
      "

    volumes:
      - jwt_keys:/keys

    restart: "no"


  # =====================================================
  # POSTGRESQL
  # =====================================================

  postgres:
    image: pgvector/pgvector:pg17

    container_name: smart-learning-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # =====================================================
  # MINIO
  # =====================================================

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z

    container_name: smart-learning-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # =====================================================
  # KAFKA
  # =====================================================

  kafka:
    image: apache/kafka:4.3.1

    container_name: smart-learning-kafka
    hostname: kafka

    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw


  # =====================================================
  # SYSTEM SERVICE
  # =====================================================

  system:
    image: smart-learning-system:local

    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: system

    restart: unless-stopped

    environment:
      API_VERSION: v1
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=system
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: system
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: "false"

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      APP_SECURITY_JWT_PUBLIC_KEY_LOCATION: file:/keys/public-key.pem
      APP_SECURITY_JWT_PRIVATE_KEY_LOCATION: file:/keys/private-key.pem

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}

    volumes:
      - jwt_keys:/keys:ro

    depends_on:
      jwt-keygen:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  # =====================================================
  # CORE SERVICE
  # =====================================================

  core:
    image: smart-learning-core:local

    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: core

    restart: unless-stopped

    environment:
      API_VERSION: v1
      SERVER_PORT: 8082

      SYSTEM_SERVICE_URL: http://system:8081

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=core
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: core
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: "false"

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/public-key.pem

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    volumes:
      - jwt_keys:/keys:ro

    depends_on:
      jwt-keygen:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

      kafka:
        condition: service_started

      system:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  # =====================================================
  # PYTHON AI MIGRATION
  # =====================================================

  python-ai-migrate:
    image: smart-learning-python-ai:local

    build:
      context: ./python-ai
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy

    command: alembic upgrade head

    restart: "no"


  # =====================================================
  # PYTHON AI API
  # =====================================================

  python-ai-api:
    image: smart-learning-python-ai:local

    build:
      context: ./python-ai
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

    depends_on:
      python-ai-migrate:
        condition: service_completed_successfully

      minio:
        condition: service_healthy

      kafka:
        condition: service_started

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s


  # =====================================================
  # PYTHON AI WORKER
  # =====================================================

  python-ai-worker:
    image: smart-learning-python-ai:local

    build:
      context: ./python-ai
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

    depends_on:
      python-ai-migrate:
        condition: service_completed_successfully

      minio:
        condition: service_healthy

      kafka:
        condition: service_started

    command:
      [
        "python",
        "-m",
        "app.workers.document_ingestion_worker"
      ]


  # =====================================================
  # JAVA AI SERVICE
  # =====================================================

  ai:
    image: smart-learning-ai:local

    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: ai

    restart: unless-stopped

    environment:
      API_VERSION: v1
      SERVER_PORT: 8083

      CORE_SERVICE_URL: http://core:8082
      AI_ENGINE_URL: http://python-ai-api:8000

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=ai_app
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ai_app
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/public-key.pem

    volumes:
      - jwt_keys:/keys:ro

    depends_on:
      jwt-keygen:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      core:
        condition: service_healthy

      python-ai-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  # =====================================================
  # GATEWAY
  # =====================================================

  gateway:
    image: smart-learning-gateway:local

    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: gateway

    restart: unless-stopped

    environment:
      GATEWAY_PORT: 8080

      SYSTEM_SERVICE_URL: http://system:8081
      CORE_SERVICE_URL: http://core:8082
      AI_SERVICE_URL: http://ai:8083

      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - "${GATEWAY_PORT:-8080}:8080"

    depends_on:
      system:
        condition: service_healthy

      core:
        condition: service_healthy

      ai:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s


  # =====================================================
  # DEMO DATA
  # =====================================================

  demo-seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile

    environment:
      SYSTEM_API_URL: http://system:8081/api/v1
      CORE_API_URL: http://core:8082/api/v1

      SEED_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      DEMO_EMAIL: ${DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}

    volumes:
      - seed_state:/state

    depends_on:
      system:
        condition: service_healthy

      core:
        condition: service_healthy

      python-ai-worker:
        condition: service_started

    command: >
      sh -c "
        if [ -f /state/.seeded ]; then
          echo 'Demo data already seeded.';
        else
          python scripts/seed_system.py &&
          python scripts/seed_demo.py &&
          touch /state/.seeded &&
          echo 'Demo data seed completed.';
        fi
      "

    restart: "no"


  # =====================================================
  # FRONTEND
  # =====================================================

  frontend:
    build:
      context: ./frontend/smart-learning-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      gateway:
        condition: service_healthy


volumes:
  postgres_data:
  minio_data:
  jwt_keys:
  seed_state: