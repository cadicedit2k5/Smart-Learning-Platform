spring:
  datasource:
    url: "jdbc:h2:mem:system_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS system"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: system
    show-sql: false

app:
  data-init:
    admin-email: admin@test.local
    admin-password: Admin@123
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: smart-learning-test
